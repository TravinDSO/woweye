[project]
name = "wow-eye"
version = "0.1.0"
description = "Bridge between the WowEye addon for WoW Forever and an AI agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3"]

[project.scripts]
wow-eye = "wow_eye.cli:main"
wow-eye-mcp = "wow_eye.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "lupa>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wow_eye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
